openapi: 3.1.0
info:
  title: CadPro TMMS Device Management API
  version: 1.0.0
  description: >-
    Contract for object/device administration, feature audit and enforcement approval,
    and PTZ preset calibration. Mutations are tenant-scoped, authorization-aware and
    use optimistic concurrency. MSW mocks must implement this same contract.
servers:
  - url: /
security:
  - sessionAuth: []
tags:
  - name: Access
  - name: Catalogs
  - name: Objects
  - name: Devices
  - name: Device Features
  - name: Enforcement Approval
  - name: Presets

paths:
  /api/v1/device-management/catalogs:
    get:
      tags: [Catalogs]
      operationId: getDeviceManagementCatalogs
      summary: Get object types, device types, capabilities, statuses and PTZ constraints
      responses:
        '200':
          description: Catalog snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalogs'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/device-management/session-context:
    get:
      tags: [Access]
      operationId: getDeviceManagementSessionContext
      summary: Get the current tenant-scoped actor and device-management permissions
      responses:
        '200':
          description: Current actor and permissions used for UI affordances
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionContext' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/device-management/objects:
    get:
      tags: [Objects]
      operationId: listObjects
      summary: Search active objects for the management list or object picker
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - name: object_type_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Bounded object page; soft-deleted records are excluded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Objects]
      operationId: createObject
      summary: Create an installation object
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObjectWrite' }
      responses:
        '201':
          description: Created object
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/device-management/objects/{objectId}:
    parameters:
      - $ref: '#/components/parameters/ObjectId'
    get:
      tags: [Objects]
      operationId: getObject
      responses:
        '200':
          description: Object detail
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Objects]
      operationId: updateObject
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObjectWrite' }
      responses:
        '200':
          description: Updated object
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
    delete:
      tags: [Objects]
      operationId: softDeleteObject
      summary: Soft delete an object; blocked while active devices remain
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Object soft deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }

  /api/v1/device-management/devices:
    get:
      tags: [Devices]
      operationId: listDevices
      summary: List active devices with combined filters
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - name: object_id
          in: query
          schema: { type: string }
        - name: object_type_id
          in: query
          schema: { type: string }
        - name: device_type_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Bounded device page; soft-deleted records are excluded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevicePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Devices]
      operationId: createDevice
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceWrite' }
      responses:
        '201':
          description: Created device
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/device-management/devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Devices]
      operationId: getDevice
      responses:
        '200':
          description: Device detail
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Devices]
      operationId: updateDevice
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceWrite' }
      responses:
        '200':
          description: Updated device
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
    delete:
      tags: [Devices]
      operationId: softDeleteDevice
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Device soft deleted; related history is retained }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/VersionConflict' }

  /api/v1/device-management/devices/{deviceId}/features:
    get:
      tags: [Device Features]
      operationId: listDeviceFeatures
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: All device-type capabilities with effective and pending state
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeviceFeature' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/device-management/devices/{deviceId}/features/{featureCode}:
    put:
      tags: [Device Features]
      operationId: updateDeviceFeature
      description: >-
        Atomically updates a non-enforcement feature and appends history. Enabling an
        enforcement feature through this operation returns ENFORCEMENT_APPROVAL_REQUIRED.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/FeatureCode'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceFeatureWrite' }
      responses:
        '200':
          description: Effective feature state after atomic history write
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceFeature' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '500': { $ref: '#/components/responses/AuditFailure' }

  /api/v1/device-management/devices/{deviceId}/features/{featureCode}/enforcement-requests:
    post:
      tags: [Enforcement Approval]
      operationId: requestEnforcementEnable
      summary: Request enforcement enable; effective state remains disabled
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/FeatureCode'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnforcementRequestCreate' }
      responses:
        '202':
          description: Pending request created; feature is not yet effective
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnforcementRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '500': { $ref: '#/components/responses/AuditFailure' }

  /api/v1/device-management/devices/{deviceId}/feature-history:
    get:
      tags: [Device Features]
      operationId: listDeviceFeatureHistory
      description: Authorized audit query remains available after device soft delete
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: feature_code
          in: query
          schema: { type: string }
      responses:
        '200':
          description: History ordered by valid_from descending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeatureHistoryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/device-management/enforcement-requests:
    get:
      tags: [Enforcement Approval]
      operationId: listEnforcementRequests
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
            default: pending
      responses:
        '200':
          description: Approval queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnforcementRequestPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/device-management/enforcement-requests/{requestId}/decision:
    post:
      tags: [Enforcement Approval]
      operationId: decideEnforcementRequest
      description: >-
        Approver must differ from requester. Approval atomically enables the feature,
        closes the request and appends history. Rejection leaves it disabled and appends history.
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnforcementDecision' }
      responses:
        '200':
          description: Terminal request with resulting effective feature
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnforcementDecisionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '500': { $ref: '#/components/responses/AuditFailure' }

  /api/v1/device-management/devices/{deviceId}/presets:
    get:
      tags: [Presets]
      operationId: listDevicePresets
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Active preset page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PresetPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Presets]
      operationId: createDevicePreset
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresetWrite' }
      responses:
        '201':
          description: Created draft or calibrated preset
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevicePreset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/device-management/devices/{deviceId}/presets/{presetId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - name: presetId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Presets]
      operationId: getDevicePreset
      responses:
        '200':
          description: Preset detail
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevicePreset' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Presets]
      operationId: updateDevicePreset
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresetWrite' }
      responses:
        '200':
          description: Updated preset; calibration metadata is server-derived
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevicePreset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
    delete:
      tags: [Presets]
      operationId: softDeleteDevicePreset
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Preset soft deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/VersionConflict' }

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: session
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque cursor from the previous response
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Search:
      name: q
      in: query
      description: Case-insensitive partial code/name search
      schema: { type: string, minLength: 1, maxLength: 100 }
    ObjectId:
      name: objectId
      in: path
      required: true
      schema: { type: string }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string }
    FeatureCode:
      name: featureCode
      in: path
      required: true
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag returned with the latest resource representation
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
  headers:
    ETag:
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request or field values
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Caller lacks permission
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found in caller scope
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Business invariant conflict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    VersionConflict:
      description: If-Match does not identify the current representation
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  status: { const: 412 }
                  code: { const: VERSION_CONFLICT }
    AuditFailure:
      description: No effective state was changed because append-only audit could not commit
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  code: { const: AUDIT_WRITE_FAILED }

  schemas:
    JsonValue:
      oneOf:
        - type: 'null'
        - type: boolean
        - type: number
        - type: string
        - type: array
          items: { $ref: '#/components/schemas/JsonValue' }
        - type: object
          additionalProperties: { $ref: '#/components/schemas/JsonValue' }
    JsonObject:
      type: object
      additionalProperties: { $ref: '#/components/schemas/JsonValue' }
    Actor:
      type: object
      additionalProperties: false
      required: [id, display_name]
      properties:
        id: { type: string }
        display_name: { type: string }
    Permission:
      type: string
      enum:
        - object.read
        - object.write
        - object.delete
        - device.read
        - device.write
        - device.delete
        - feature.write
        - enforcement.request
        - enforcement.approve
        - preset.write
        - preset.delete
        - audit.read
    SessionContext:
      type: object
      additionalProperties: false
      required: [actor, permissions]
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        permissions:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Permission' }
    PageMeta:
      type: object
      additionalProperties: false
      required: [limit, has_more, next_cursor]
      properties:
        limit: { type: integer, minimum: 1, maximum: 100 }
        has_more: { type: boolean }
        next_cursor: { type: [string, 'null'] }
    GeoJsonPoint:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: { type: string, const: Point }
        coordinates:
          type: array
          minItems: 2
          maxItems: 2
          prefixItems:
            - { type: number, minimum: -180, maximum: 180 }
            - { type: number, minimum: -90, maximum: 90 }
    Position:
      type: array
      minItems: 2
      maxItems: 2
      prefixItems:
        - { type: number, minimum: -180, maximum: 180 }
        - { type: number, minimum: -90, maximum: 90 }
    GeoJsonPolygon:
      type: object
      additionalProperties: false
      description: >-
        CRS84 Polygon with one closed outer ring, 3..500 distinct vertices, positive area,
        no self-intersection and no antimeridian crossing. Semantic rules are server validated.
      required: [type, coordinates]
      properties:
        type: { type: string, const: Polygon }
        coordinates:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: array
            minItems: 4
            maxItems: 501
            items: { $ref: '#/components/schemas/Position' }
    ObjectType:
      type: object
      additionalProperties: false
      required: [id, code, name]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
    NumericConstraint:
      type: object
      additionalProperties: false
      required: [min, max, step]
      properties:
        min: { type: number }
        max: { type: number }
        step: { type: number, exclusiveMinimum: 0 }
    PtzConstraints:
      type: object
      additionalProperties: false
      required: [pan, tilt, zoom]
      properties:
        pan: { $ref: '#/components/schemas/NumericConstraint' }
        tilt: { $ref: '#/components/schemas/NumericConstraint' }
        zoom: { $ref: '#/components/schemas/NumericConstraint' }
    Feature:
      type: object
      additionalProperties: false
      required: [id, code, name, is_enforcement]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        emits_stream_type_id: { type: [string, 'null'] }
        is_enforcement: { type: boolean }
        map_layer: { type: [string, 'null'] }
        default_config: { $ref: '#/components/schemas/JsonObject' }
    DeviceType:
      type: object
      additionalProperties: false
      required: [id, code, name, capabilities, ptz_constraints]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        icon_id: { type: [string, 'null'] }
        ui_panel: { type: [string, 'null'] }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
        ptz_constraints:
          oneOf:
            - { $ref: '#/components/schemas/PtzConstraints' }
            - { type: 'null' }
          description: Required and non-null when capabilities include ptz or lpr
    Catalogs:
      type: object
      additionalProperties: false
      required: [object_types, device_types, object_statuses, device_statuses]
      properties:
        object_types:
          type: array
          items: { $ref: '#/components/schemas/ObjectType' }
        device_types:
          type: array
          items: { $ref: '#/components/schemas/DeviceType' }
        object_statuses:
          type: array
          items: { type: string }
        device_statuses:
          type: array
          items: { type: string }
    ObjectSummary:
      type: object
      additionalProperties: false
      required: [id, code, name, object_type]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        object_type: { $ref: '#/components/schemas/ObjectType' }
    ObjectWrite:
      type: object
      required: [code, name, object_type_id, location, status, attrs]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
          description: Globally unique, including soft-deleted object records; codes are not reusable in MVP
        name: { type: string, minLength: 1, maxLength: 255 }
        object_type_id: { type: string }
        location: { $ref: '#/components/schemas/GeoJsonPoint' }
        status: { type: string }
        attrs: { $ref: '#/components/schemas/JsonObject' }
    ObjectRecord:
      allOf:
        - $ref: '#/components/schemas/ObjectWrite'
        - type: object
          required: [id, object_type, version, created_at, updated_at, deleted_at]
          properties:
            id: { type: string }
            object_type: { $ref: '#/components/schemas/ObjectType' }
            version: { type: integer, minimum: 1 }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            deleted_at: { type: [string, 'null'], format: date-time }
    ObjectPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ObjectRecord' }
        page: { $ref: '#/components/schemas/PageMeta' }
    DeviceWrite:
      type: object
      required: [code, name, serial, device_type_id, object_id, config, status]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
          description: Globally unique, including soft-deleted device records; codes are not reusable in MVP
        name: { type: string, minLength: 1, maxLength: 255 }
        serial: { type: [string, 'null'], maxLength: 255 }
        device_type_id: { type: string }
        object_id: { type: string }
        config: { $ref: '#/components/schemas/JsonObject' }
        status: { type: string }
    DeviceRecord:
      allOf:
        - $ref: '#/components/schemas/DeviceWrite'
        - type: object
          required: [id, device_type, object, last_seen_at, version, created_at, updated_at, deleted_at]
          properties:
            id: { type: string }
            device_type: { $ref: '#/components/schemas/DeviceType' }
            object: { $ref: '#/components/schemas/ObjectSummary' }
            last_seen_at: { type: [string, 'null'], format: date-time }
            version: { type: integer, minimum: 1 }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            deleted_at: { type: [string, 'null'], format: date-time }
    DevicePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/DeviceRecord' }
        page: { $ref: '#/components/schemas/PageMeta' }
    EnforcementRequestSummary:
      type: object
      additionalProperties: false
      required: [id, status, requested_at, requested_by, reason, etag]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending] }
        requested_at: { type: string, format: date-time }
        requested_by: { $ref: '#/components/schemas/Actor' }
        reason: { type: string }
        etag:
          type: string
          description: Opaque token to send as If-Match when deciding this request
    DeviceFeature:
      type: object
      additionalProperties: false
      required: [device_id, feature, is_enabled, config, pending_request, version, etag, updated_at, updated_by]
      properties:
        device_id: { type: string }
        feature: { $ref: '#/components/schemas/Feature' }
        is_enabled: { type: boolean }
        config: { $ref: '#/components/schemas/JsonObject' }
        pending_request:
          oneOf:
            - { $ref: '#/components/schemas/EnforcementRequestSummary' }
            - { type: 'null' }
        version: { type: integer, minimum: 1 }
        etag:
          type: string
          description: Opaque token to send as If-Match for the next feature mutation
        updated_at: { type: string, format: date-time }
        updated_by:
          oneOf:
            - { $ref: '#/components/schemas/Actor' }
            - { type: 'null' }
    DeviceFeatureWrite:
      type: object
      additionalProperties: false
      required: [is_enabled, config]
      properties:
        is_enabled: { type: boolean }
        config: { $ref: '#/components/schemas/JsonObject' }
        reason: { type: [string, 'null'], maxLength: 1000 }
    EnforcementRequestCreate:
      type: object
      additionalProperties: false
      required: [reason, requested_config]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
        requested_config: { $ref: '#/components/schemas/JsonObject' }
    EnforcementRequest:
      type: object
      additionalProperties: false
      required: [id, device_id, feature, requested_config, reason, status, requested_at, requested_by, decided_at, decided_by, decision_note, version, etag]
      properties:
        id: { type: string }
        device_id: { type: string }
        feature: { $ref: '#/components/schemas/Feature' }
        requested_config: { $ref: '#/components/schemas/JsonObject' }
        reason: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        requested_at: { type: string, format: date-time }
        requested_by: { $ref: '#/components/schemas/Actor' }
        decided_at: { type: [string, 'null'], format: date-time }
        decided_by:
          oneOf:
            - { $ref: '#/components/schemas/Actor' }
            - { type: 'null' }
        decision_note: { type: [string, 'null'], maxLength: 1000 }
        version: { type: integer, minimum: 1 }
        etag:
          type: string
          description: Opaque token to send as If-Match while the request is pending
    EnforcementDecision:
      type: object
      additionalProperties: false
      required: [decision, note]
      properties:
        decision: { type: string, enum: [approve, reject] }
        note: { type: [string, 'null'], maxLength: 1000 }
    EnforcementDecisionResult:
      type: object
      additionalProperties: false
      required: [request, feature]
      properties:
        request: { $ref: '#/components/schemas/EnforcementRequest' }
        feature: { $ref: '#/components/schemas/DeviceFeature' }
    FeatureHistoryEvent:
      type: object
      additionalProperties: false
      required: [id, device_id, feature, event_type, before, after, reason, approval_request_id, valid_from, actor]
      properties:
        id: { type: string }
        device_id: { type: string }
        feature: { $ref: '#/components/schemas/Feature' }
        event_type:
          type: string
          enum: [enabled, disabled, config_changed, approval_requested, approved, rejected]
        before:
          oneOf:
            - { $ref: '#/components/schemas/JsonObject' }
            - { type: 'null' }
        after:
          oneOf:
            - { $ref: '#/components/schemas/JsonObject' }
            - { type: 'null' }
        reason: { type: [string, 'null'] }
        approval_request_id: { type: [string, 'null'] }
        valid_from: { type: string, format: date-time }
        actor: { $ref: '#/components/schemas/Actor' }
    FeatureHistoryPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/FeatureHistoryEvent' }
        page: { $ref: '#/components/schemas/PageMeta' }
    EnforcementRequestPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/EnforcementRequest' }
        page: { $ref: '#/components/schemas/PageMeta' }
    PresetWrite:
      type: object
      required: [preset_no, name, pan, tilt, zoom, enforcement_zone, lane_label, approach]
      properties:
        preset_no: { type: integer, minimum: 1, maximum: 9999 }
        name: { type: string, minLength: 1, maxLength: 255 }
        pan: { type: [number, 'null'] }
        tilt: { type: [number, 'null'] }
        zoom: { type: [number, 'null'] }
        enforcement_zone:
          oneOf:
            - { $ref: '#/components/schemas/GeoJsonPolygon' }
            - { type: 'null' }
        lane_label: { type: [string, 'null'], maxLength: 255 }
        approach: { type: [string, 'null'], maxLength: 255 }
    DevicePreset:
      allOf:
        - $ref: '#/components/schemas/PresetWrite'
        - type: object
          required: [id, device_id, is_calibrated, calibrated_at, calibrated_by, version, created_at, updated_at, deleted_at]
          properties:
            id: { type: string }
            device_id: { type: string }
            is_calibrated: { type: boolean, readOnly: true }
            calibrated_at: { type: [string, 'null'], format: date-time, readOnly: true }
            calibrated_by:
              oneOf:
                - { $ref: '#/components/schemas/Actor' }
                - { type: 'null' }
              readOnly: true
            version: { type: integer, minimum: 1 }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            deleted_at: { type: [string, 'null'], format: date-time }
    PresetPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/DevicePreset' }
        page: { $ref: '#/components/schemas/PageMeta' }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        field_errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
